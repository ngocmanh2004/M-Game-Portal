<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/assets/image/logos/logoWeb.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/assets/image/logos/logoWeb.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="M-Game Portal — Nền tảng game trực tuyến hàng đầu. Developed by Mạnh" />
    <meta name="author" content="Mạnh" />
    <meta name="copyright" content="© 2025 Mạnh. All rights reserved." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/image/logos/logoWeb.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>M-Game Portal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- ⭐ SNOWFALL EFFECT -->
    <canvas id="snow-canvas" style="position:fixed;pointer-events:none;z-index:99999;top:0;left:0;width:100vw;height:100vh;"></canvas>
    <script>
      // Simple snow effect
      const canvas = document.getElementById('snow-canvas');
      const ctx = canvas.getContext('2d');
      let W = window.innerWidth, H = window.innerHeight;
      canvas.width = W; canvas.height = H;
      let mp = 80, particles = [];
      for(let i = 0; i < mp; i++) {
        particles.push({
          x: Math.random()*W,
          y: Math.random()*H,
          r: Math.random()*4+1,
          d: Math.random()*mp
        });
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.beginPath();
        for(let i = 0; i < mp; i++) {
          let p = particles[i];
          ctx.moveTo(p.x, p.y);
          ctx.arc(p.x, p.y, p.r, 0, Math.PI*2, true);
        }
        ctx.fill();
        update();
      }
      let angle = 0;
      function update() {
        angle += 0.01;
        for(let i = 0; i < mp; i++) {
          let p = particles[i];
          p.y += Math.cos(angle+p.d) + 1 + p.r/2;
          p.x += Math.sin(angle) * 2;
          if(p.x > W+5 || p.x < -5 || p.y > H) {
            if(i%3 > 0) {
              particles[i] = {x: Math.random()*W, y: -10, r: p.r, d: p.d};
            } else {
              if(Math.sin(angle) > 0) {
                particles[i] = {x: -5, y: Math.random()*H, r: p.r, d: p.d};
              } else {
                particles[i] = {x: W+5, y: Math.random()*H, r: p.r, d: p.d};
              }
            }
          }
        }
      }
      setInterval(draw, 33);
      window.addEventListener('resize', () => {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W; canvas.height = H;
      });
    </script>
  </body>
</html>
